<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>🐢 龟龟水印 · 手机版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #262b34;
    --border: #2e333d;
    --text: #e6e8ec;
    --muted: #9aa0aa;
    --accent: #4f8cff;
    --accent-2: #3a6fd8;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }
  /* ---------- Top bar ---------- */
  .topbar {
    padding: calc(10px + var(--safe-t)) 14px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 20;
  }
  .topbar .title { font-size: 15px; font-weight: 600; flex: 1; }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .icon-btn:disabled { opacity: .4; }
  .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  /* ---------- Stage ---------- */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(45deg, #16181d 25%, transparent 25%),
      linear-gradient(-45deg, #16181d 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #16181d 75%),
      linear-gradient(-45deg, transparent 75%, #16181d 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #101216;
    touch-action: none;
  }
  #canvasWrap {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    line-height: 0;
    box-shadow: 0 6px 30px rgba(0,0,0,.5);
    will-change: transform;
  }
  #view { display: block; }
  .drop {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 30px;
    gap: 14px;
  }
  .drop h2 { font-size: 19px; color: var(--text); }
  .drop p { font-size: 13px; line-height: 1.7; }
  .drop .big {
    margin-top: 8px;
    background: var(--accent); color: #fff; border: none;
    padding: 14px 30px; border-radius: 12px; font-size: 15px; font-weight: 600;
    font-family: inherit;
  }
  /* ---------- Mode hint ---------- */
  .mode-hint {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    z-index: 15;
  }
  .mode-hint b { color: var(--accent); }
  /* ---------- Bottom toolbar ---------- */
  .toolbar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 14px calc(12px + var(--safe-b));
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }
  .tools-row { display: flex; gap: 8px; }
  .tool {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 11px 0;
    font-size: 13px;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }
  .tool .ic { font-size: 18px; }
  .tool:disabled { opacity: .4; }
  .tool.active { border-color: var(--accent); color: var(--accent); background: #1d2635; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row label { font-size: 12px; color: var(--muted); width: 56px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .slider-row .v { font-size: 12px; color: var(--text); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .go-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .go-btn:disabled { opacity: .4; }
  /* ---------- Status ---------- */
  .status {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 30;
    color: #fff;
    font-size: 14px;
  }
  .status.show { display: flex; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  input[type=file] { display: none; }
  /* ---------- Sheet (help) ---------- */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; z-index: 40; align-items: flex-end;
  }
  .sheet-mask.show { display: flex; }
  .sheet {
    width: 100%;
    background: var(--panel);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(24px + var(--safe-b));
    border-top: 1px solid var(--border);
  }
  .sheet h3 { font-size: 16px; margin-bottom: 12px; }
  .sheet ol { padding-left: 20px; font-size: 14px; line-height: 1.9; color: var(--text); }
  .sheet .close { margin-top: 16px; width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-size: 14px; font-family: inherit; }
  /* ---------- Mode tabs ---------- */
  .mode-tabs {
    display: flex;
    gap: 4px;
    background: var(--panel-2);
    padding: 3px;
    border-radius: 10px;
    margin-right: 6px;
  }
  .mode-tab {
    padding: 6px 10px;
    border-radius: 7px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .mode-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  /* toolbar variants: only one is shown at a time */
  .toolbar[data-mode] { display: none; }
  .toolbar.active { display: flex; }
  /* watermark quick-strip */
  .wm-strip {
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto;
    padding: 4px 0;
  }
  .wm-item {
    flex: none;
    padding: 8px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 12px;
    max-width: 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wm-item.active { border-color: var(--accent); color: var(--accent); }
  .wm-add {
    flex: none; padding: 8px 12px; background: var(--accent);
    color: #fff; border: none; border-radius: 10px;
    font-size: 12px; font-weight: 600; font-family: inherit;
  }
  /* Color chips */
  .chip-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .color-chip {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .color-chip.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,140,255,.4); }
  /* Sheet form fields */
  .sheet-field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
  .sheet-field label { font-size: 12px; color: var(--muted); }
  .sheet-field textarea, .sheet-field input[type=text], .sheet-field select {
    width: 100%; padding: 10px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-family: inherit;
  }
  .sheet-field textarea { min-height: 60px; resize: none; }
  .sheet-field input[type=range] { width: 100%; accent-color: var(--accent); }
  .sheet-toggle {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    font-size: 14px; color: var(--text); cursor: pointer;
  }
  .sheet-toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .sheet-tabs {
    display: flex; gap: 6px;
    background: var(--panel-2); padding: 4px;
    border-radius: 10px; margin-bottom: 12px;
  }
  .sheet-tab {
    flex: 1; padding: 8px; border-radius: 8px;
    background: transparent; border: none; color: var(--text);
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  .sheet-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .sheet-tab-pane { display: none; }
  .sheet-tab-pane.active { display: block; }
  /* List rows inside sheets */
  .list-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin: 6px 0;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .list-row .label {
    flex: 1; font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .list-row .del {
    flex: none; padding: 4px 10px; background: transparent;
    border: 1px solid var(--border); color: #ff5c5c;
    border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .list-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
  .btn-full {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px;
    font-family: inherit; margin-bottom: 8px;
  }
  .btn-full.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .sheet-scroll { max-height: 65vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
</style>
</head>
<body>
<div class="topbar">
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="remove">🧽 去除</button>
    <button class="mode-tab" data-mode="add">➕ 添加</button>
    <button class="mode-tab" data-mode="edit">✏ 编辑</button>
  </div>
  <button class="icon-btn" id="installBtn" style="display:none;">安装</button>
  <button class="icon-btn" id="helpBtn">?</button>
  <button class="icon-btn" id="openBtn">打开</button>
  <button class="icon-btn primary" id="saveBtn" disabled>保存</button>
</div>

<div class="stage" id="stage">
  <div id="canvasWrap" style="display:none;">
    <canvas id="view"></canvas>
  </div>
  <div class="drop" id="drop">
    <h2>选择要去水印的图片</h2>
    <p>从相册选择一张图片<br>全程在手机本地处理，不会上传</p>
    <button class="big" id="pickBtn">🖼 从相册选择</button>
  </div>
  <div class="mode-hint" id="modeHint" style="display:none;"><b>单指</b>涂抹水印 · <b>双指</b>缩放/移动</div>
  <div class="status" id="status">
    <div class="spinner"></div>
    <div id="statusText">正在去除水印…</div>
  </div>
</div>

<!-- Remove mode toolbar -->
<div class="toolbar active" data-mode="remove">
  <div class="tools-row">
    <button class="tool active" id="brushBtn" disabled><span class="ic">🖌</span>画笔</button>
    <button class="tool" id="eraserBtn" disabled><span class="ic">🧹</span>擦除</button>
    <button class="tool" id="undoBtn" disabled><span class="ic">↶</span>撤销</button>
    <button class="tool" id="clearBtn" disabled><span class="ic">✕</span>清涂</button>
    <button class="tool" id="resetBtn" disabled><span class="ic">⟲</span>还原</button>
  </div>
  <div class="slider-row">
    <label>笔刷</label>
    <input type="range" id="sizeRange" min="6" max="140" value="40">
    <span class="v" id="sizeVal">40px</span>
  </div>
  <div class="slider-row">
    <label>清晰度</label>
    <input type="range" id="clarityRange" min="1" max="4" value="2">
    <span class="v" id="clarityVal">中</span>
  </div>
  <div class="slider-row">
    <label>强度</label>
    <input type="range" id="qualityRange" min="1" max="3" value="2">
    <span class="v" id="qualityVal">标准</span>
  </div>
  <label class="slider-row" style="gap:8px;cursor:pointer;">
    <input type="checkbox" id="aiToggle" checked style="width:20px;height:20px;accent-color:var(--accent);flex:none;">
    <span style="font-size:12px;color:var(--text);flex:1;">AI 智能修复（更自然，首次需联网下载模型）</span>
  </label>
  <button class="go-btn" id="inpaintBtn" disabled>✨ 去除水印</button>
</div>

<!-- Add mode toolbar -->
<div class="toolbar" data-mode="add">
  <div class="wm-strip" id="wmStrip"></div>
  <div class="tools-row">
    <button class="tool" id="editWmBtn" disabled><span class="ic">📝</span>文字</button>
    <button class="tool" id="styleWmBtn" disabled><span class="ic">🎨</span>样式</button>
    <button class="tool" id="transformWmBtn" disabled><span class="ic">🔄</span>变换</button>
    <button class="tool" id="libraryBtn"><span class="ic">📚</span>库</button>
    <button class="tool" id="templatesBtn"><span class="ic">🎁</span>模板</button>
  </div>
  <div class="tools-row">
    <button class="tool" id="saveWmBtn" disabled><span class="ic">💾</span>存水印</button>
    <button class="tool" id="saveTplBtn" disabled><span class="ic">💾</span>存模板</button>
    <button class="tool" id="batchBtn" disabled><span class="ic">📦</span>批量</button>
    <button class="tool" id="deleteWmBtn" disabled><span class="ic">🗑</span>删除</button>
  </div>
</div>

<!-- Edit mode toolbar -->
<div class="toolbar" data-mode="edit">
  <div class="tools-row">
    <button class="tool active" id="editBrushBtn" disabled><span class="ic">🖌</span>画笔</button>
    <button class="tool" id="editCropBtn" disabled><span class="ic">✂</span>裁剪</button>
    <button class="tool" id="rotateLeftBtn" disabled><span class="ic">⟲</span>左转</button>
    <button class="tool" id="rotateRightBtn" disabled><span class="ic">⟳</span>右转</button>
    <button class="tool" id="editUndoBtn" disabled><span class="ic">↶</span>撤销</button>
  </div>
  <div class="slider-row" id="editBrushSizeRow">
    <label>笔刷</label>
    <input type="range" id="editSizeRange" min="4" max="140" value="10">
    <span class="v" id="editSizeVal">10px</span>
  </div>
  <div class="chip-grid" id="editColorPalette" style="padding:2px 0;"></div>
  <div id="editCropActions" style="display:none;gap:8px;">
    <button class="tool" id="confirmCropBtn" disabled style="flex:1;">✓ 确认裁剪</button>
    <button class="tool" id="cancelCropBtn" disabled style="flex:1;">取消</button>
  </div>
</div>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <h3>使用方法</h3>
    <ol>
      <li>点右上角"打开"，选择带水印的图片</li>
      <li>用<b>单指</b>在水印上涂抹（涂成红色）</li>
      <li><b>两根手指</b>可以缩放、拖动图片，方便涂细节</li>
      <li>点底部"去除水印"</li>
      <li>效果不好可反复涂抹、反复去除，或调高"强度"</li>
      <li>满意后点右上角"保存"，在弹出面板选"存储图像"即可存到相册</li>
    </ol>
    <button class="close" id="sheetClose">知道了</button>
  </div>
</div>

<!-- Text edit sheet -->
<div class="sheet-mask" id="textSheetMask">
  <div class="sheet sheet-scroll">
    <h3>文本内容</h3>
    <div class="sheet-field">
      <label>文字</label>
      <textarea id="wmText" placeholder="输入文字"></textarea>
    </div>
    <div class="sheet-field">
      <label>字体</label>
      <select id="wmFont">
        <option value="Microsoft YaHei">微软雅黑</option>
        <option value="SimHei">黑体</option>
        <option value="SimSun">宋体</option>
        <option value="KaiTi">楷体</option>
        <option value="FangSong">仿宋</option>
        <option value="STXihei">华文细黑</option>
        <option value="STKaiti">华文楷体</option>
        <option value="STLiti">华文隶书</option>
        <option value="STCaiyun">华文彩云</option>
        <option value="STHupo">华文琥珀</option>
        <option value="Arial">Arial</option>
        <option value="Impact">Impact</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Verdana">Verdana</option>
        <option value="Courier New">Courier New</option>
      </select>
    </div>
    <div class="sheet-field">
      <label>字号 <span id="wmFontSizeVal" style="color:var(--text);">48 px</span></label>
      <input type="range" id="wmFontSize" min="12" max="200" value="48">
    </div>
    <div class="sheet-field">
      <label>颜色</label>
      <div class="chip-grid" id="wmColorPalette"></div>
    </div>
    <button class="sheet close" id="textSheetClose">完成</button>
  </div>
</div>

<!-- Style sheet -->
<div class="sheet-mask" id="styleSheetMask">
  <div class="sheet sheet-scroll">
    <h3>样式</h3>
    <div class="sheet-field">
      <label>透明度 <span id="wmOpacityVal" style="color:var(--text);">80%</span></label>
      <input type="range" id="wmOpacity" min="0" max="100" value="80">
    </div>
    <label class="sheet-toggle">
      <input type="checkbox" id="wmBorderToggle"><span>描边</span>
    </label>
    <div id="wmBorderPanel" style="display:none;">
      <div class="sheet-field">
        <label>描边颜色</label>
        <div class="chip-grid" id="wmBorderPalette"></div>
      </div>
      <div class="sheet-field">
        <label>描边宽度 <span id="wmBorderWidthVal" style="color:var(--text);">2 px</span></label>
        <input type="range" id="wmBorderWidth" min="1" max="8" value="2">
      </div>
    </div>
    <label class="sheet-toggle">
      <input type="checkbox" id="wmBgToggle"><span>背景</span>
    </label>
    <div id="wmBgPanel" style="display:none;">
      <div class="sheet-field">
        <label>背景颜色</label>
        <div class="chip-grid" id="wmBgPalette"></div>
      </div>
      <div class="sheet-field">
        <label>背景透明度 <span id="wmBgOpacityVal" style="color:var(--text);">60%</span></label>
        <input type="range" id="wmBgOpacity" min="0" max="100" value="60">
      </div>
      <div class="sheet-field">
        <label>圆角 <span id="wmBgRadiusVal" style="color:var(--text);">0 px</span></label>
        <input type="range" id="wmBgRadius" min="0" max="50" value="0">
      </div>
    </div>
    <button class="sheet close" id="styleSheetClose">完成</button>
  </div>
</div>

<!-- Transform sheet -->
<div class="sheet-mask" id="transformSheetMask">
  <div class="sheet">
    <h3>变换</h3>
    <div class="sheet-field">
      <label>旋转 <span id="wmRotationVal" style="color:var(--text);">0°</span></label>
      <input type="range" id="wmRotation" min="-180" max="180" value="0">
    </div>
    <button class="btn-full" id="wmResetPosBtn">⟲ 重置到中心</button>
    <button class="sheet close" id="transformSheetClose">完成</button>
  </div>
</div>

<!-- Library / Templates sheet -->
<div class="sheet-mask" id="libSheetMask">
  <div class="sheet sheet-scroll">
    <div class="sheet-tabs">
      <button class="sheet-tab active" data-tab="library">我的水印库</button>
      <button class="sheet-tab" data-tab="templates">模板</button>
    </div>
    <div class="sheet-tab-pane active" data-tab="library">
      <div id="libraryList"></div>
    </div>
    <div class="sheet-tab-pane" data-tab="templates">
      <div id="tplList"></div>
    </div>
    <button class="sheet close" id="libSheetClose">关闭</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="batchFileInput" accept="image/*" multiple>
<script src="./ai-inpaint.js"></script>
<script>
"use strict";
(function () {
  // ---------- Canvases ----------
  const workCanvas = document.createElement("canvas");
  const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });
  const maskCanvas = document.createElement("canvas");
  const maskCtx = maskCanvas.getContext("2d", { willReadFrequently: true });
  const view = document.getElementById("view");
  const viewCtx = view.getContext("2d");

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), wrap = $("canvasWrap"), drop = $("drop");
  const status = $("status"), statusText = $("statusText"), modeHint = $("modeHint");

  // ---------- State ----------
  let hasImage = false;
  let appMode = "remove";   // "remove" | "add" | "edit"
  let tool = "brush";
  let brushSize = 40;      // image px
  const MAX_SIDE = 2400;   // cap working resolution for phone performance

  // view transform: image px -> screen px inside stage
  let tx = 0, ty = 0, zoom = 1, minZoom = 1;

  const undoStack = [];
  const MAX_UNDO = 8;

  // watermark state
  let textWatermarks = [];
  let selectedWatermarkIndex = -1;
  let isDraggingText = false;
  let dragOffset = { x: 0, y: 0 };

  // edit mode state
  let editTool = "brush";       // "brush" | "crop"
  let editBrushColor = "#ff3b3b";
  let editBrushSize = 10;
  let cropRect = null;
  let cropStart = null;
  let cropDragging = false;

  const controls = ["saveBtn","brushBtn","eraserBtn","undoBtn","clearBtn","resetBtn","inpaintBtn",
    "editBrushBtn","editCropBtn","rotateLeftBtn","rotateRightBtn",
    "libraryBtn","templatesBtn"];
  const setEnabled = (on) => controls.forEach(id => { const el=$(id); if (el) el.disabled = !on; });

  // 常用颜色
  const PALETTE = [
    "#ffffff", "#f5f5f5", "#c0c0c0", "#808080", "#404040", "#000000",
    "#ff3b3b", "#ff9800", "#ffeb3b", "#4caf50", "#00bcd4", "#2196f3",
    "#673ab7", "#e91e63", "#795548", "#8b0000", "#006400", "#00008b",
    "#4b0082", "#ff6b6b", "#ffd93d", "#6bcf7f", "#f472b6", "#c084fc"
  ];

  // ---------- 水印库 & 模板存储 ----------
  const STORAGE_WATERMARKS = "guigui_watermarks_v1";
  const STORAGE_TEMPLATES = "guigui_templates_v1";

  function watermarkToNormalized(wm, W, H) {
    return {
      text: wm.text, nx: wm.x/W, ny: wm.y/H, nfontSize: wm.fontSize/H,
      fontFamily: wm.fontFamily, color: wm.color, opacity: wm.opacity,
      rotation: wm.rotation,
      hasBorder: wm.hasBorder, borderColor: wm.borderColor, borderWidth: wm.borderWidth,
      hasBackground: wm.hasBackground, backgroundColor: wm.backgroundColor,
      backgroundOpacity: wm.backgroundOpacity, bgRadius: wm.bgRadius || 0
    };
  }
  function normalizedToWatermark(nw, W, H) {
    return {
      text: nw.text, x: nw.nx*W, y: nw.ny*H, fontSize: Math.max(8, nw.nfontSize*H),
      fontFamily: nw.fontFamily, color: nw.color, opacity: nw.opacity,
      rotation: nw.rotation,
      hasBorder: nw.hasBorder, borderColor: nw.borderColor, borderWidth: nw.borderWidth,
      hasBackground: nw.hasBackground, backgroundColor: nw.backgroundColor,
      backgroundOpacity: nw.backgroundOpacity, bgRadius: nw.bgRadius || 0
    };
  }
  const BUILTIN_TEMPLATES = [
    { id:"builtin-corner", name:"🎁 简约角标", isBuiltin:true, watermarks:[
      { text:"© 我的水印", nx:0.82, ny:0.94, nfontSize:0.035,
        fontFamily:"Microsoft YaHei", color:"#ffffff", opacity:0.85, rotation:0,
        hasBorder:true, borderColor:"#000000", borderWidth:2,
        hasBackground:false, backgroundColor:"#000000", backgroundOpacity:0.6, bgRadius:0 } ]},
    { id:"builtin-center-large", name:"🎁 居中大字", isBuiltin:true, watermarks:[
      { text:"样品展示", nx:0.5, ny:0.5, nfontSize:0.12,
        fontFamily:"SimHei", color:"#ffffff", opacity:0.55, rotation:-15,
        hasBorder:true, borderColor:"#000000", borderWidth:4,
        hasBackground:false, backgroundColor:"#000000", backgroundOpacity:0.5, bgRadius:0 } ]},
    { id:"builtin-badge", name:"🎁 红色徽章", isBuiltin:true, watermarks:[
      { text:"限时特惠", nx:0.18, ny:0.1, nfontSize:0.045,
        fontFamily:"Microsoft YaHei", color:"#ffffff", opacity:1, rotation:-8,
        hasBorder:false, borderColor:"#000000", borderWidth:2,
        hasBackground:true, backgroundColor:"#ff3b3b", backgroundOpacity:0.92, bgRadius:20 } ]},
    { id:"builtin-two-corners", name:"🎁 上下双条", isBuiltin:true, watermarks:[
      { text:"微信：xxxxxxx", nx:0.5, ny:0.06, nfontSize:0.03,
        fontFamily:"Microsoft YaHei", color:"#ffffff", opacity:0.9, rotation:0,
        hasBorder:false, borderColor:"#000000", borderWidth:2,
        hasBackground:true, backgroundColor:"#000000", backgroundOpacity:0.55, bgRadius:12 },
      { text:"© 我的品牌", nx:0.5, ny:0.95, nfontSize:0.028,
        fontFamily:"Microsoft YaHei", color:"#ffffff", opacity:0.85, rotation:0,
        hasBorder:true, borderColor:"#000000", borderWidth:2,
        hasBackground:false, backgroundColor:"#000000", backgroundOpacity:0.6, bgRadius:0 } ]},
    { id:"builtin-diagonal-tile", name:"🎁 斜向平铺（防盗图）", isBuiltin:true, watermarks:(function(){
      const arr=[]; const positions=[[0.2,0.2],[0.55,0.2],[0.85,0.2],[0.35,0.5],[0.7,0.5],[0.2,0.8],[0.55,0.8],[0.85,0.8]];
      positions.forEach(([nx,ny])=>arr.push({
        text:"样品", nx, ny, nfontSize:0.045,
        fontFamily:"SimHei", color:"#ffffff", opacity:0.32, rotation:-30,
        hasBorder:false, borderColor:"#000000", borderWidth:1,
        hasBackground:false, backgroundColor:"#000000", backgroundOpacity:0.5, bgRadius:0
      }));
      return arr;
    })() }
  ];

  let savedWatermarks = [];
  let userTemplates = [];
  function loadFromStorage() {
    try { const w=localStorage.getItem(STORAGE_WATERMARKS); if (w) savedWatermarks=JSON.parse(w)||[]; }
    catch(e){ console.warn(e); }
    try { const t=localStorage.getItem(STORAGE_TEMPLATES); if (t) userTemplates=JSON.parse(t)||[]; }
    catch(e){ console.warn(e); }
  }
  function persistWatermarks(){ try{ localStorage.setItem(STORAGE_WATERMARKS, JSON.stringify(savedWatermarks));}catch(e){console.warn(e);} }
  function persistTemplates(){ try{ localStorage.setItem(STORAGE_TEMPLATES, JSON.stringify(userTemplates));}catch(e){console.warn(e);} }

  function defaultWatermark() {
    return {
      text:"水印文字", x:workCanvas.width/2, y:workCanvas.height/2,
      fontSize: Math.max(24, Math.round(workCanvas.height * 0.05)),
      fontFamily:"Microsoft YaHei", color:"#ffffff", opacity:0.85, rotation:0,
      hasBorder:true, borderColor:"#000000", borderWidth:2,
      hasBackground:false, backgroundColor:"#000000", backgroundOpacity:0.6, bgRadius:0
    };
  }
  function getSelectedWatermark(){ return textWatermarks[selectedWatermarkIndex] || null; }

  function showStatus(t) { statusText.textContent = t; status.classList.add("show"); }
  function hideStatus() { status.classList.remove("show"); }

  // ---------- Load ----------
  function loadImage(src) {
    const img = new Image();
    img.onload = () => { setupImage(img); URL.revokeObjectURL(src); };
    img.onerror = () => alert("无法加载该图片");
    img.src = src;
  }
  function setupImage(img) {
    let w = img.naturalWidth, h = img.naturalHeight;
    const longest = Math.max(w, h);
    if (longest > MAX_SIDE) { const k = MAX_SIDE / longest; w = Math.round(w*k); h = Math.round(h*k); }
    workCanvas.width = maskCanvas.width = view.width = w;
    workCanvas.height = maskCanvas.height = view.height = h;
    workCtx.clearRect(0,0,w,h);
    workCtx.drawImage(img, 0, 0, w, h);
    maskCtx.clearRect(0,0,w,h);
    undoStack.length = 0;
    hasImage = true;
    drop.style.display = "none";
    wrap.style.display = "block";
    modeHint.style.display = "block";
    setEnabled(true);
    $("undoBtn").disabled = true;
    if ($("editUndoBtn")) $("editUndoBtn").disabled = true;
    // reset watermarks & crop state
    textWatermarks = [];
    selectedWatermarkIndex = -1;
    cropRect = null; cropDragging = false;
    if ($("confirmCropBtn")) $("confirmCropBtn").disabled = true;
    if ($("cancelCropBtn")) $("cancelCropBtn").disabled = true;
    updateWmStrip();
    refreshWmButtonStates();
    fitView();
    render();
    setTimeout(() => { modeHint.style.transition = "opacity .5s"; modeHint.style.opacity = "0"; }, 3500);
  }

  function fitView() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    minZoom = Math.min(sw / workCanvas.width, sh / workCanvas.height);
    zoom = minZoom;
    tx = (sw - workCanvas.width * zoom) / 2;
    ty = (sh - workCanvas.height * zoom) / 2;
    applyTransform();
  }
  function applyTransform() {
    wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
  }
  function renderTextWatermark(ctx, wm) {
    if (!wm || !wm.text.trim()) return;
    ctx.save();
    ctx.translate(wm.x, wm.y);
    ctx.rotate(wm.rotation * Math.PI / 180);
    ctx.font = `${wm.fontSize}px "${wm.fontFamily}", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const metrics = ctx.measureText(wm.text);
    const textWidth = metrics.width;
    const textHeight = wm.fontSize * 1.2;
    if (wm.hasBackground) {
      ctx.globalAlpha = wm.backgroundOpacity;
      ctx.fillStyle = wm.backgroundColor;
      const padX = textWidth * 0.2, padY = textHeight * 0.1;
      const radius = wm.bgRadius || 0;
      if (radius > 0) {
        const x = -textWidth/2 - padX, y = -textHeight/2 - padY;
        const w = textWidth + padX*2, h = textHeight + padY*2;
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-textWidth/2 - padX, -textHeight/2 - padY,
                     textWidth + padX*2, textHeight + padY*2);
      }
    }
    ctx.globalAlpha = wm.opacity;
    if (wm.hasBorder) {
      ctx.strokeStyle = wm.borderColor;
      ctx.lineWidth = wm.borderWidth;
      ctx.lineJoin = "round";
      ctx.strokeText(wm.text, 0, 0);
    }
    ctx.fillStyle = wm.color;
    ctx.fillText(wm.text, 0, 0);
    // 选中框
    if (appMode === "add" && wm === getSelectedWatermark()) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#4f8cff";
      ctx.lineWidth = Math.max(2, wm.fontSize * 0.03);
      ctx.setLineDash([wm.fontSize * 0.15, wm.fontSize * 0.1]);
      const padX = textWidth * 0.2, padY = textHeight * 0.1;
      ctx.strokeRect(-textWidth/2 - padX, -textHeight/2 - padY,
                     textWidth + padX*2, textHeight + padY*2);
    }
    ctx.restore();
  }

  function render() {
    viewCtx.clearRect(0,0,view.width,view.height);
    viewCtx.drawImage(workCanvas,0,0);
    if (appMode === "remove") {
      viewCtx.globalAlpha = 0.55;
      viewCtx.drawImage(maskCanvas,0,0);
      viewCtx.globalAlpha = 1;
    } else if (appMode === "add") {
      textWatermarks.forEach(wm => renderTextWatermark(viewCtx, wm));
    } else if (appMode === "edit" && cropRect && cropRect.w > 0 && cropRect.h > 0) {
      viewCtx.save();
      viewCtx.fillStyle = "rgba(0,0,0,0.5)";
      viewCtx.fillRect(0, 0, view.width, view.height);
      viewCtx.clearRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      viewCtx.drawImage(workCanvas,
        cropRect.x, cropRect.y, cropRect.w, cropRect.h,
        cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      viewCtx.strokeStyle = "#4f8cff";
      viewCtx.lineWidth = Math.max(3, workCanvas.height * 0.005);
      viewCtx.setLineDash([workCanvas.height * 0.02, workCanvas.height * 0.015]);
      viewCtx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      viewCtx.restore();
    }
  }

  // 水印命中检测（考虑旋转）
  function isPointInText(px, py, wm) {
    if (!wm || !wm.text.trim()) return false;
    const tc = document.createElement("canvas");
    const tctx = tc.getContext("2d");
    tctx.font = `${wm.fontSize}px "${wm.fontFamily}", sans-serif`;
    const metrics = tctx.measureText(wm.text);
    const textWidth = metrics.width;
    const textHeight = wm.fontSize * 1.2;
    const padX = textWidth * 0.2, padY = textHeight * 0.1;
    const dx = px - wm.x, dy = py - wm.y;
    const rad = -wm.rotation * Math.PI / 180;
    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
    const halfW = textWidth / 2 + padX;
    const halfH = textHeight / 2 + padY;
    return lx >= -halfW && lx <= halfW && ly >= -halfH && ly <= halfH;
  }
  function hitTestWatermarks(px, py) {
    for (let i = textWatermarks.length - 1; i >= 0; i--) {
      if (isPointInText(px, py, textWatermarks[i])) return i;
    }
    return -1;
  }

  // Edit brush
  function editStamp(x, y) {
    workCtx.globalCompositeOperation = "source-over";
    workCtx.fillStyle = editBrushColor;
    workCtx.beginPath();
    workCtx.arc(x, y, editBrushSize / 2, 0, Math.PI * 2);
    workCtx.fill();
  }
  let editLastPt = null;
  function editStrokeTo(x, y) {
    if (!editLastPt) { editStamp(x, y); editLastPt = { x, y }; return; }
    const dx = x - editLastPt.x, dy = y - editLastPt.y;
    const dist = Math.hypot(dx, dy);
    const step = Math.max(1, editBrushSize / 4);
    const n = Math.ceil(dist / step);
    for (let i = 1; i <= n; i++) editStamp(editLastPt.x + dx*i/n, editLastPt.y + dy*i/n);
    editLastPt = { x, y };
  }

  function confirmCrop() {
    if (!cropRect) return;
    const x = Math.max(0, Math.round(cropRect.x));
    const y = Math.max(0, Math.round(cropRect.y));
    const w = Math.min(workCanvas.width - x, Math.round(cropRect.w));
    const h = Math.min(workCanvas.height - y, Math.round(cropRect.h));
    if (w < 5 || h < 5) { cancelCrop(); return; }
    pushUndo();
    const cropped = document.createElement("canvas");
    cropped.width = w; cropped.height = h;
    cropped.getContext("2d").drawImage(workCanvas, x, y, w, h, 0, 0, w, h);
    workCanvas.width = w; workCanvas.height = h;
    maskCanvas.width = w; maskCanvas.height = h;
    view.width = w; view.height = h;
    workCtx.drawImage(cropped, 0, 0);
    maskCtx.clearRect(0, 0, w, h);
    cropRect = null;
    $("confirmCropBtn").disabled = true;
    $("cancelCropBtn").disabled = true;
    fitView();
    render();
  }
  function cancelCrop() {
    cropRect = null;
    $("confirmCropBtn").disabled = true;
    $("cancelCropBtn").disabled = true;
    render();
  }
  function rotateImage(deg) {
    pushUndo();
    const rotated = document.createElement("canvas");
    const rad = deg * Math.PI / 180;
    const nw = workCanvas.height, nh = workCanvas.width;
    rotated.width = nw; rotated.height = nh;
    const rctx = rotated.getContext("2d");
    rctx.translate(nw/2, nh/2);
    rctx.rotate(rad);
    rctx.drawImage(workCanvas, -workCanvas.width/2, -workCanvas.height/2);
    workCanvas.width = nw; workCanvas.height = nh;
    maskCanvas.width = nw; maskCanvas.height = nh;
    view.width = nw; view.height = nh;
    workCtx.drawImage(rotated, 0, 0);
    maskCtx.clearRect(0, 0, nw, nh);
    cropRect = null;
    fitView();
    render();
  }
  // ---------- Screen -> image coords ----------
  function toImage(clientX, clientY) {
    const r = stage.getBoundingClientRect();
    const sx = clientX - r.left, sy = clientY - r.top;
    return { x: (sx - tx) / zoom, y: (sy - ty) / zoom };
  }

  // ---------- Mask painting ----------
  let lastPt = null;
  function stamp(x, y) {
    maskCtx.beginPath();
    if (tool === "brush") {
      maskCtx.globalCompositeOperation = "source-over";
      maskCtx.fillStyle = "#ff3b3b";
    } else {
      maskCtx.globalCompositeOperation = "destination-out";
    }
    maskCtx.arc(x, y, brushSize/2, 0, Math.PI*2);
    maskCtx.fill();
    maskCtx.globalCompositeOperation = "source-over";
  }
  function strokeTo(x, y) {
    if (!lastPt) { stamp(x,y); lastPt = {x,y}; return; }
    const dx = x-lastPt.x, dy = y-lastPt.y, dist = Math.hypot(dx,dy);
    const step = Math.max(1, brushSize/4), n = Math.ceil(dist/step);
    for (let i=1;i<=n;i++) stamp(lastPt.x+dx*i/n, lastPt.y+dy*i/n);
    lastPt = {x,y};
  }

  // ---------- Gesture engine ----------
  const pointers = new Map();     // id -> {x,y}
  let gesture = "none";           // "none" | "pending" | "draw" | "pinch"
  let pinchStart = null;
  let pendingId = null;           // 单指落下后待确认的指针
  let pendingTimer = null;        // 延迟落笔计时器
  const TAP_DELAY = 90;           // ms：这段时间内若第二指到达则判为缩放，不落笔

  function clearPending() {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    pendingId = null;
  }

  stage.addEventListener("pointerdown", (e) => {
    if (!hasImage) return;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      // 先不落笔：等一小段时间确认不是双指缩放的第一根手指
      gesture = "pending";
      pendingId = e.pointerId;
      lastPt = null;
      editLastPt = null;
      clearPending();
      pendingTimer = setTimeout(() => {
        pendingTimer = null;
        if (gesture === "pending" && pointers.size === 1) {
          gesture = "draw";
          const pt = pointers.get(pendingId);
          if (!pt) return;
          const p = toImage(pt.x, pt.y);
          if (appMode === "remove") {
            strokeTo(p.x, p.y); render();
          } else if (appMode === "add") {
            const idx = hitTestWatermarks(p.x, p.y);
            if (idx >= 0) {
              selectedWatermarkIndex = idx;
              const wm = textWatermarks[idx];
              isDraggingText = true;
              dragOffset.x = p.x - wm.x;
              dragOffset.y = p.y - wm.y;
            } else {
              selectedWatermarkIndex = -1;
            }
            updateWmStrip();
            refreshWmButtonStates();
            render();
          } else if (appMode === "edit") {
            if (editTool === "brush") {
              pushUndo();
              editStamp(p.x, p.y); render();
            } else if (editTool === "crop") {
              cropDragging = true;
              cropStart = { x: p.x, y: p.y };
              cropRect = { x: p.x, y: p.y, w: 0, h: 0 };
            }
          }
        }
      }, TAP_DELAY);
    } else if (pointers.size === 2) {
      // 第二指到达：取消待落笔，进入缩放
      clearPending();
      isDraggingText = false;
      cropDragging = false;
      gesture = "pinch";
      startPinch();
    }
  });

  stage.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (gesture === "draw" && pointers.size === 1) {
      const p = toImage(e.clientX, e.clientY);
      if (appMode === "remove") {
        strokeTo(p.x, p.y); render();
      } else if (appMode === "add") {
        const wm = getSelectedWatermark();
        if (isDraggingText && wm) {
          wm.x = p.x - dragOffset.x;
          wm.y = p.y - dragOffset.y;
          render();
        }
      } else if (appMode === "edit") {
        if (editTool === "brush") {
          editStrokeTo(p.x, p.y); render();
        } else if (editTool === "crop" && cropDragging) {
          cropRect = {
            x: Math.min(cropStart.x, p.x),
            y: Math.min(cropStart.y, p.y),
            w: Math.abs(p.x - cropStart.x),
            h: Math.abs(p.y - cropStart.y)
          };
          render();
        }
      }
    } else if (gesture === "pinch" && pointers.size >= 2) {
      updatePinch();
    }
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    lastPt = null;
    editLastPt = null;
    // 若在待确认期间就抬起（快速点一下）
    if (gesture === "pending" && e.pointerId === pendingId) {
      clearPending();
      const p = toImage(e.clientX, e.clientY);
      if (appMode === "remove") {
        stamp(p.x, p.y); render();
      } else if (appMode === "add") {
        const idx = hitTestWatermarks(p.x, p.y);
        selectedWatermarkIndex = idx;
        updateWmStrip();
        refreshWmButtonStates();
        render();
      } else if (appMode === "edit") {
        if (editTool === "brush") {
          pushUndo();
          editStamp(p.x, p.y); render();
        }
      }
    }
    // 结束拖拽/裁剪
    isDraggingText = false;
    if (cropDragging) {
      cropDragging = false;
      const valid = cropRect && cropRect.w >= 5 && cropRect.h >= 5;
      $("confirmCropBtn").disabled = !valid;
      $("cancelCropBtn").disabled = !valid;
    }
    if (pointers.size === 0) { gesture = "none"; clearPending(); }
    else if (pointers.size === 1) { gesture = "none"; }
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  function twoPoints() {
    const pts = [...pointers.values()];
    return [pts[0], pts[1]];
  }
  function startPinch() {
    const [a,b] = twoPoints();
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    pinchStart = {
      dist: Math.hypot(a.x-b.x, a.y-b.y),
      cx, cy, zoom, tx, ty,
    };
  }
  function updatePinch() {
    const [a,b] = twoPoints();
    if (!pinchStart) { startPinch(); return; }
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    const r = stage.getBoundingClientRect();
    let newZoom = pinchStart.zoom * (dist / pinchStart.dist);
    newZoom = Math.max(minZoom * 0.9, Math.min(minZoom * 12, newZoom));
    // keep the pinch center anchored, plus allow panning with the center movement
    const anchorX = pinchStart.cx - r.left, anchorY = pinchStart.cy - r.top;
    const imgX = (anchorX - pinchStart.tx) / pinchStart.zoom;
    const imgY = (anchorY - pinchStart.ty) / pinchStart.zoom;
    const curCx = cx - r.left, curCy = cy - r.top;
    tx = curCx - imgX * newZoom;
    ty = curCy - imgY * newZoom;
    zoom = newZoom;
    applyTransform();
  }
  // ================= Inpainting (multi-scale diffusion) =================
  function buildMask() {
    const W = workCanvas.width, H = workCanvas.height;
    const md = maskCtx.getImageData(0,0,W,H).data;
    const m = new Uint8Array(W*H);
    for (let i=0,p=3;i<m.length;i++,p+=4) m[i] = md[p] > 10 ? 1 : 0;
    return m;
  }
  function maskIsEmpty() {
    const d = maskCtx.getImageData(0,0,maskCanvas.width,maskCanvas.height).data;
    for (let i=3;i<d.length;i+=4) if (d[i]>10) return false;
    return true;
  }
  // mask-aware 2x downscale of Float32 RGB + Uint8 mask (a cell is a hole only
  // if ALL four source pixels are holes, so known colour survives as long as possible).
  function downscale(rgb, mask, W, H) {
    const W2 = Math.max(1, W >> 1), H2 = Math.max(1, H >> 1);
    const d = new Float32Array(W2 * H2 * 3), dm = new Uint8Array(W2 * H2);
    for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
      let r = 0, g = 0, b = 0, cnt = 0, holes = 0, total = 0;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
        const sx = Math.min(W - 1, x*2+dx), sy = Math.min(H - 1, y*2+dy), si = sy*W+sx;
        total++;
        if (mask[si]) { holes++; continue; }
        r += rgb[si*3]; g += rgb[si*3+1]; b += rgb[si*3+2]; cnt++;
      }
      const di = y*W2+x;
      if (cnt > 0) { d[di*3]=r/cnt; d[di*3+1]=g/cnt; d[di*3+2]=b/cnt; }
      dm[di] = (holes === total) ? 1 : 0;
    }
    return { rgb: d, mask: dm, W: W2, H: H2 };
  }

  // Jacobi diffusion in place: fill holes with 4-neighbour average. Gives the
  // PatchMatch a sensible colour starting point inside large holes.
  function diffuseFill(data, mask, W, H, iters) {
    let buf = data, next = new Float32Array(buf.length);
    for (let it = 0; it < iters; it++) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y*W+x;
        if (!mask[i]) { next[i*3]=buf[i*3]; next[i*3+1]=buf[i*3+1]; next[i*3+2]=buf[i*3+2]; continue; }
        const xm=x>0?x-1:x, xp=x<W-1?x+1:x, ym=y>0?y-1:y, yp=y<H-1?y+1:y;
        for (let c=0;c<3;c++)
          next[i*3+c]=0.25*(buf[(y*W+xm)*3+c]+buf[(y*W+xp)*3+c]+buf[(ym*W+x)*3+c]+buf[(yp*W+x)*3+c]);
      }
      const t=buf; buf=next; next=t;
    }
    if (buf !== data) data.set(buf);
  }

  // Sum of squared colour differences between two PxP patches, with early-out.
  function patchSSD(rgb, W, tx, ty, sx, sy, P, best) {
    let sum = 0;
    for (let dy = 0; dy < P; dy++) {
      let ti = ((ty+dy)*W + tx) * 3, si = ((sy+dy)*W + sx) * 3;
      for (let dx = 0; dx < P; dx++) {
        const dr=rgb[ti]-rgb[si], dg=rgb[ti+1]-rgb[si+1], db=rgb[ti+2]-rgb[si+2];
        sum += dr*dr + dg*dg + db*db;
        ti += 3; si += 3;
      }
      if (sum > best) return sum;
    }
    return sum;
  }

  // PatchMatch texture completion at one resolution. Fills holes in `rgb` by
  // copying real PxP patches from the known region. Returns the offset field so
  // the next finer pyramid level can be seeded from it.
  function patchMatchLevel(rgb, mask, W, H, P, emIters, pmIters, rng, seed) {
    const maxX = W - P, maxY = H - P;
    if (maxX < 0 || maxY < 0) return null;
    const IW = W + 1;
    const integ = new Int32Array(IW * (H + 1));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      integ[(y+1)*IW+(x+1)] = mask[y*W+x] + integ[y*IW+(x+1)] + integ[(y+1)*IW+x] - integ[y*IW+x];
    const holesIn = (x,y) => integ[(y+P)*IW+(x+P)] - integ[y*IW+(x+P)] - integ[(y+P)*IW+x] + integ[y*IW+x];
    const validSrc = (x,y) => x>=0 && y>=0 && x<=maxX && y<=maxY && holesIn(x,y)===0;

    const srcList = [];
    for (let y = 0; y <= maxY; y++) for (let x = 0; x <= maxX; x++) if (holesIn(x,y)===0) srcList.push(y*W+x);
    if (srcList.length === 0) return null;

    const isTarget = new Uint8Array(W*H);
    const targets = [];
    for (let y = 0; y <= maxY; y++) for (let x = 0; x <= maxX; x++)
      if (holesIn(x,y) > 0) { isTarget[y*W+x]=1; targets.push(y*W+x); }

    const nx = new Int32Array(W*H), ny = new Int32Array(W*H);
    for (const t of targets) {
      if (seed && validSrc(seed.nx[t], seed.ny[t])) { nx[t]=seed.nx[t]; ny[t]=seed.ny[t]; }
      else { const r = srcList[(rng()*srcList.length)|0]; nx[t]=r%W; ny[t]=(r/W)|0; }
    }
    const dist = new Float64Array(W*H);
    for (const t of targets) { const tx=t%W, ty=(t/W)|0; dist[t]=patchSSD(rgb,W,tx,ty,nx[t],ny[t],P,Infinity); }

    const maxR = Math.max(W, H);
    for (let em = 0; em < emIters; em++) {
      for (let pm = 0; pm < pmIters; pm++) {
        const rev = pm & 1;
        for (let k = 0; k < targets.length; k++) {
          const idx = rev ? targets.length-1-k : k;
          const t = targets[idx], tx = t%W, ty = (t/W)|0;
          const dirs = rev ? [[1,0],[0,1]] : [[-1,0],[0,-1]];
          for (let di = 0; di < 2; di++) {
            const ox = dirs[di][0], oy = dirs[di][1];
            const npx = tx+ox, npy = ty+oy;
            if (npx<0||npy<0||npx>maxX||npy>maxY||!isTarget[npy*W+npx]) continue;
            const csx = nx[npy*W+npx]-ox, csy = ny[npy*W+npx]-oy;
            if (!validSrc(csx,csy)) continue;
            const d = patchSSD(rgb,W,tx,ty,csx,csy,P,dist[t]);
            if (d < dist[t]) { dist[t]=d; nx[t]=csx; ny[t]=csy; }
          }
          let radius = maxR;
          while (radius >= 1) {
            const rx = nx[t] + (((rng()*2-1)*radius)|0);
            const ry = ny[t] + (((rng()*2-1)*radius)|0);
            if (validSrc(rx,ry)) {
              const d = patchSSD(rgb,W,tx,ty,rx,ry,P,dist[t]);
              if (d < dist[t]) { dist[t]=d; nx[t]=rx; ny[t]=ry; }
            }
            radius = (radius/2)|0;
          }
        }
      }
      const accR=new Float64Array(W*H), accG=new Float64Array(W*H), accB=new Float64Array(W*H), accW=new Float64Array(W*H);
      for (const t of targets) {
        const tx=t%W, ty=(t/W)|0, sx=nx[t], sy=ny[t];
        for (let dy=0;dy<P;dy++) for (let dx=0;dx<P;dx++) {
          const pIdx=(ty+dy)*W+(tx+dx);
          if (!mask[pIdx]) continue;
          const sIdx=((sy+dy)*W+(sx+dx))*3;
          accR[pIdx]+=rgb[sIdx]; accG[pIdx]+=rgb[sIdx+1]; accB[pIdx]+=rgb[sIdx+2]; accW[pIdx]++;
        }
      }
      for (let i=0;i<W*H;i++){ if(!mask[i]||accW[i]===0)continue; rgb[i*3]=accR[i]/accW[i]; rgb[i*3+1]=accG[i]/accW[i]; rgb[i*3+2]=accB[i]/accW[i]; }
      for (const t of targets){ const tx=t%W,ty=(t/W)|0; dist[t]=patchSSD(rgb,W,tx,ty,nx[t],ny[t],P,Infinity); }
    }
    return { nx, ny };
  }

  // Upscale an offset field to the next finer level (offsets double).
  function upscaleNNF(nnf, W, H, W2, H2) {
    const nx = new Int32Array(W2*H2), ny = new Int32Array(W2*H2);
    for (let y=0;y<H2;y++) for (let x=0;x<W2;x++) {
      const sx = Math.min(W-1, x>>1), sy = Math.min(H-1, y>>1), si = sy*W+sx;
      nx[y*W2+x] = x + (nnf.nx[si]*2 - (sx*2));
      ny[y*W2+x] = y + (nnf.ny[si]*2 - (sy*2));
    }
    return { nx, ny };
  }

  // deterministic PRNG so results are stable and Date.now()-free
  function makeRng(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

  function runInpaint(quality) {
    const W = workCanvas.width, H = workCanvas.height;
    const img = workCtx.getImageData(0, 0, W, H);
    const px = img.data;
    const mask = buildMask();

    const base = new Float32Array(W * H * 3);
    for (let i = 0; i < W * H; i++) { base[i*3]=px[i*4]; base[i*3+1]=px[i*4+1]; base[i*3+2]=px[i*4+2]; }

    const minSide = 32;
    const levels = [{ rgb: base, mask, W, H }];
    while (Math.min(levels[levels.length-1].W, levels[levels.length-1].H) > minSide) {
      const t = levels[levels.length-1];
      levels.push(downscale(t.rgb, t.mask, t.W, t.H));
    }

    const P = 7;
    const emIters = [0, 3, 5, 8][quality] || 5;
    const pmIters = [0, 3, 4, 6][quality] || 4;
    const rng = makeRng(20240607);

    let nnf = null, pW = 0, pH = 0;
    for (let l = levels.length - 1; l >= 0; l--) {
      const lv = levels[l];
      diffuseFill(lv.rgb, lv.mask, lv.W, lv.H, 30);
      const seed = nnf ? upscaleNNF(nnf, pW, pH, lv.W, lv.H) : null;
      const out = patchMatchLevel(lv.rgb, lv.mask, lv.W, lv.H, P, emIters, pmIters, rng, seed);
      if (out) { nnf = out; pW = lv.W; pH = lv.H; }
      else { nnf = null; }
    }

    // Final coherence pass: replace each hole pixel with the ACTUAL pixel from
    // its single best-matching source patch. No averaging -> sharp real texture
    // instead of a soft blur.
    if (nnf) {
      const half = P >> 1, mX = W - P, mY = H - P;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y*W+x;
        if (!mask[i]) continue;
        let tlx = x - half; if (tlx < 0) tlx = 0; else if (tlx > mX) tlx = mX;
        let tly = y - half; if (tly < 0) tly = 0; else if (tly > mY) tly = mY;
        const tl = tly*W + tlx;
        let sx = nnf.nx[tl] + (x - tlx), sy = nnf.ny[tl] + (y - tly);
        if (sx < 0) sx = 0; else if (sx >= W) sx = W-1;
        if (sy < 0) sy = 0; else if (sy >= H) sy = H-1;
        const si = (sy*W + sx)*3;
        base[i*3] = base[si]; base[i*3+1] = base[si+1]; base[i*3+2] = base[si+2];
      }
    }

    for (let i = 0; i < W * H; i++) {
      if (!mask[i]) continue;
      px[i*4]   = Math.max(0, Math.min(255, base[i*3]   + 0.5)) | 0;
      px[i*4+1] = Math.max(0, Math.min(255, base[i*3+1] + 0.5)) | 0;
      px[i*4+2] = Math.max(0, Math.min(255, base[i*3+2] + 0.5)) | 0;
      px[i*4+3] = 255;
    }
    workCtx.putImageData(img, 0, 0);
  }
  function pushUndo() {
    if (undoStack.length>=MAX_UNDO) undoStack.shift();
    undoStack.push(workCtx.getImageData(0,0,workCanvas.width,workCanvas.height));
    $("undoBtn").disabled=false;
    if ($("editUndoBtn")) $("editUndoBtn").disabled = false;
  }
  function runClassic(quality) {
    pushUndo();
    runInpaint(quality);
    maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
    render();
  }

  async function doInpaint() {
    if (!hasImage) return;
    if (maskIsEmpty()) { alert("请先用手指涂抹要去除的水印区域。"); return; }
    const quality=parseInt($("qualityRange").value,10);
    const useAI = $("aiToggle") && $("aiToggle").checked && typeof AIInpaint !== "undefined";

    if (!useAI) {
      showStatus("正在去除水印…");
      await new Promise(r=>setTimeout(r,20));
      try { runClassic(quality); }
      catch(err){ console.error(err); alert("处理出错："+err.message); }
      finally { hideStatus(); }
      return;
    }

    try {
      showStatus("AI 正在修复…");
      // 先让浏览器重绘一帧，确保提示能显示（推理同步计算会阻塞主线程）
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
      const result = await AIInpaint.inpaint(workCanvas, maskCanvas, (p)=>{
        if (p<1) showStatus("下载 AI 模型 "+Math.round(p*100)+"%");
        else showStatus("AI 正在修复…");
      }, { maxSide: currentMaxSide() });
      pushUndo();
      workCtx.putImageData(result,0,0);
      maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
      render();
      hideStatus();
    } catch(err) {
      console.error("AI 失败，回退：", err);
      showStatus("AI 不可用，改用快速修复…");
      await new Promise(r=>setTimeout(r,20));
      try { runClassic(quality); }
      catch(e2){ console.error(e2); alert("处理出错："+e2.message); }
      finally {
        hideStatus();
        if (!window.__aiWarned) {
          window.__aiWarned = true;
          setTimeout(()=>alert("AI 模型加载失败，已改用本地快速修复。\n\n具体错误（反馈时请发这段）：\n" + (err && err.message ? err.message : err)), 100);
        }
      }
    }
  }

  // ---------- Save ----------

    if (!hasAnyWm) return workCanvas;
    const composite = document.createElement("canvas");
    composite.width = workCanvas.width;
    composite.height = workCanvas.height;

    ctx.drawImage(workCanvas, 0, 0);

                     appMode === "edit" ? "编辑_" : "去水印_";
      const name = prefix + Date.now() + ".png";
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "处理结果" });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;

      chip.dataset.color = color;
      chip.onclick = () => {
        onPick(color);
        [...c.children].forEach(x =>
          x.classList.toggle("active", x.dataset.color === color));
      };
      c.appendChild(chip);
    });
    const cur = getCurrent && getCurrent();
    if (cur) [...c.children].forEach(x =>
      x.classList.toggle("active", x.dataset.color === cur));
  }
  function setPaletteActive(containerId, color) {
    const c = $(containerId); if (!c) return;
    [...c.children].forEach(x =>
      x.classList.toggle("active", x.dataset.color === color));
  }

  buildPalette("wmColorPalette",
    (c) => { const w = getSelectedWatermark(); if (w) { w.color = c; render(); } },
    () => { const w = getSelectedWatermark(); return w ? w.color : null; });
  buildPalette("wmBorderPalette",
    (c) => { const w = getSelectedWatermark(); if (w) { w.borderColor = c; render(); } },
    () => { const w = getSelectedWatermark(); return w ? w.borderColor : null; });
  buildPalette("wmBgPalette",
    (c) => { const w = getSelectedWatermark(); if (w) { w.backgroundColor = c; render(); } },
    () => { const w = getSelectedWatermark(); return w ? w.backgroundColor : null; });
  buildPalette("editColorPalette",
    (c) => { editBrushColor = c; },
    () => editBrushColor);

  // ---------- Sheet mask helper ----------
  function openSheet(id) {
    const el = $(id);
    if (el) el.classList.add("show");
  }
  function closeSheet(id) {
    const el = $(id);
    if (el) el.classList.remove("show");
  }
  ["textSheetMask","styleSheetMask","transformSheetMask","libSheetMask"].forEach(id => {
    const el = $(id);
    if (el) el.addEventListener("click", (e) => { if (e.target === el) el.classList.remove("show"); });
  });

  // ---------- Text sheet ----------
  function syncTextSheet() {
    const wm = getSelectedWatermark(); if (!wm) return;
    $("wmText").value = wm.text;
    $("wmFont").value = wm.fontFamily;
    $("wmFontSize").value = wm.fontSize;
    $("wmFontSizeVal").textContent = wm.fontSize + " px";
    setPaletteActive("wmColorPalette", wm.color);
  }
  $("editWmBtn").onclick = () => { if (!getSelectedWatermark()) return; syncTextSheet(); openSheet("textSheetMask"); };
  $("textSheetClose").onclick = () => closeSheet("textSheetMask");
  $("wmText").oninput = (e) => { const w=getSelectedWatermark(); if (!w) return; w.text = e.target.value; updateWmStrip(); render(); };
  $("wmFont").onchange = (e) => { const w=getSelectedWatermark(); if (!w) return; w.fontFamily = e.target.value; render(); };
  $("wmFontSize").oninput = (e) => {
    const v = parseInt(e.target.value, 10);
    $("wmFontSizeVal").textContent = v + " px";
    const w = getSelectedWatermark(); if (!w) return; w.fontSize = v; render();
  };

  // ---------- Style sheet ----------
  function syncStyleSheet() {
    const wm = getSelectedWatermark(); if (!wm) return;
    $("wmOpacity").value = Math.round(wm.opacity*100);
    $("wmOpacityVal").textContent = Math.round(wm.opacity*100) + "%";
    $("wmBorderToggle").checked = wm.hasBorder;
    $("wmBorderPanel").style.display = wm.hasBorder ? "" : "none";
    $("wmBorderWidth").value = wm.borderWidth;
    $("wmBorderWidthVal").textContent = wm.borderWidth + " px";
    $("wmBgToggle").checked = wm.hasBackground;
    $("wmBgPanel").style.display = wm.hasBackground ? "" : "none";
    $("wmBgOpacity").value = Math.round(wm.backgroundOpacity*100);
    $("wmBgOpacityVal").textContent = Math.round(wm.backgroundOpacity*100) + "%";
    $("wmBgRadius").value = wm.bgRadius || 0;
    $("wmBgRadiusVal").textContent = (wm.bgRadius||0) + " px";
    setPaletteActive("wmBorderPalette", wm.borderColor);
    setPaletteActive("wmBgPalette", wm.backgroundColor);
  }
  $("styleWmBtn").onclick = () => { if (!getSelectedWatermark()) return; syncStyleSheet(); openSheet("styleSheetMask"); };
  $("styleSheetClose").onclick = () => closeSheet("styleSheetMask");
  $("wmOpacity").oninput = (e) => {
    $("wmOpacityVal").textContent = e.target.value + "%";
    const w=getSelectedWatermark(); if (!w) return;
    w.opacity = parseInt(e.target.value,10)/100; render();
  };
  $("wmBorderToggle").onchange = (e) => {
    $("wmBorderPanel").style.display = e.target.checked ? "" : "none";
    const w=getSelectedWatermark(); if (!w) return; w.hasBorder = e.target.checked; render();
  };
  $("wmBorderWidth").oninput = (e) => {
    $("wmBorderWidthVal").textContent = e.target.value + " px";
    const w=getSelectedWatermark(); if (!w) return; w.borderWidth = parseInt(e.target.value,10); render();
  };
  $("wmBgToggle").onchange = (e) => {
    $("wmBgPanel").style.display = e.target.checked ? "" : "none";
    const w=getSelectedWatermark(); if (!w) return; w.hasBackground = e.target.checked; render();
  };
  $("wmBgOpacity").oninput = (e) => {
    $("wmBgOpacityVal").textContent = e.target.value + "%";
    const w=getSelectedWatermark(); if (!w) return; w.backgroundOpacity = parseInt(e.target.value,10)/100; render();
  };
  $("wmBgRadius").oninput = (e) => {
    $("wmBgRadiusVal").textContent = e.target.value + " px";
    const w=getSelectedWatermark(); if (!w) return; w.bgRadius = parseInt(e.target.value,10); render();
  };

  // ---------- Transform sheet ----------
  function syncTransformSheet() {
    const wm = getSelectedWatermark(); if (!wm) return;
    $("wmRotation").value = wm.rotation;
    $("wmRotationVal").textContent = wm.rotation + "°";
  }
  $("transformWmBtn").onclick = () => { if (!getSelectedWatermark()) return; syncTransformSheet(); openSheet("transformSheetMask"); };
  $("transformSheetClose").onclick = () => closeSheet("transformSheetMask");
  $("wmRotation").oninput = (e) => {
    $("wmRotationVal").textContent = e.target.value + "°";
    const w=getSelectedWatermark(); if (!w) return; w.rotation = parseInt(e.target.value,10); render();
  };
  $("wmResetPosBtn").onclick = () => {
    const w=getSelectedWatermark(); if (!w) return;
    w.x = workCanvas.width/2; w.y = workCanvas.height/2; render();
  };

  // ---------- Library / Templates ----------
  function renderLibrary() {
    const list = $("libraryList");
    if (!list) return;
    list.innerHTML = "";
    if (!savedWatermarks.length) {
      const empty = document.createElement("div");
      empty.className = "list-empty";
      empty.textContent = "还没有保存的水印";
      list.appendChild(empty);
      return;
    }
    savedWatermarks.forEach((sw, i) => {
      const row = document.createElement("div");
      row.className = "list-row";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = sw.text || "(空)";
      label.onclick = () => {
        if (!hasImage) { alert("请先打开一张图片"); return; }
        const wm = normalizedToWatermark(sw, workCanvas.width, workCanvas.height);
        textWatermarks.push(wm);
        selectedWatermarkIndex = textWatermarks.length - 1;
        updateWmStrip();
        refreshWmButtonStates();
        closeSheet("libSheetMask");
        render();
      };
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "删除";
      del.onclick = (e) => {
        e.stopPropagation();
        if (!confirm("删除「" + (sw.text || "空") + "」？")) return;
        savedWatermarks.splice(i, 1);
        persistWatermarks();
        renderLibrary();
      };
      row.appendChild(label);
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  function renderTpls() {
    const list = $("tplList");
    if (!list) return;
    list.innerHTML = "";
    const all = [...BUILTIN_TEMPLATES, ...userTemplates];
    all.forEach((tpl, i) => {
      const row = document.createElement("div");
      row.className = "list-row";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = tpl.name + " (" + tpl.watermarks.length + ")";
      label.onclick = () => {
        if (!hasImage) { alert("请先打开一张图片"); return; }
        const wms = tpl.watermarks.map(nw =>
          normalizedToWatermark(nw, workCanvas.width, workCanvas.height));
        textWatermarks.push(...wms);
        selectedWatermarkIndex = textWatermarks.length - 1;
        updateWmStrip();
        refreshWmButtonStates();
        closeSheet("libSheetMask");
        render();
      };
      row.appendChild(label);
      if (!tpl.isBuiltin) {
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "删除";
        del.onclick = (e) => {
          e.stopPropagation();
          if (!confirm("删除模板「" + tpl.name + "」？")) return;
          const uidx = i - BUILTIN_TEMPLATES.length;
          if (uidx >= 0) {
            userTemplates.splice(uidx, 1);
            persistTemplates();
            renderTpls();
          }
        };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
  }
  $("libraryBtn").onclick = () => {
    renderLibrary();
    // switch to library tab
    document.querySelectorAll(".sheet-tab").forEach(t =>
      t.classList.toggle("active", t.dataset.tab === "library"));
    document.querySelectorAll(".sheet-tab-pane").forEach(p =>
      p.classList.toggle("active", p.dataset.tab === "library"));
    openSheet("libSheetMask");
  };
  $("templatesBtn").onclick = () => {
    renderTpls();
    document.querySelectorAll(".sheet-tab").forEach(t =>
      t.classList.toggle("active", t.dataset.tab === "templates"));
    document.querySelectorAll(".sheet-tab-pane").forEach(p =>
      p.classList.toggle("active", p.dataset.tab === "templates"));
    openSheet("libSheetMask");
  };
  $("libSheetClose").onclick = () => closeSheet("libSheetMask");
  document.querySelectorAll(".sheet-tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".sheet-tab").forEach(b => b.classList.toggle("active", b === t));
    document.querySelectorAll(".sheet-tab-pane").forEach(p =>
      p.classList.toggle("active", p.dataset.tab === t.dataset.tab));
    if (t.dataset.tab === "library") renderLibrary(); else renderTpls();
  });
  $("saveWmBtn").onclick = () => {
    const wm = getSelectedWatermark(); if (!wm) return;
    savedWatermarks.push(watermarkToNormalized(wm, workCanvas.width, workCanvas.height));
    persistWatermarks();
    showStatus("已保存到库"); setTimeout(hideStatus, 900);
  };
  $("saveTplBtn").onclick = () => {
    if (!textWatermarks.length) return;
    const name = prompt("模板名称：", "我的模板 " + (userTemplates.length + 1));
    if (!name) return;
    userTemplates.push({
      id: "user-" + Date.now(), name: name, isBuiltin: false,
      watermarks: textWatermarks.map(w => watermarkToNormalized(w, workCanvas.width, workCanvas.height))
    });
    persistTemplates();
    showStatus("模板已保存"); setTimeout(hideStatus, 900);
  };

  // ---------- Batch processing ----------
  $("batchBtn").onclick = () => $("batchFileInput").click();
  $("batchFileInput").onchange = (e) => {
    const files = e.target.files;
    e.target.value = "";
    if (!files || !files.length) return;
    if (!textWatermarks.length) { alert("当前没有水印可用于批量处理"); return; }
    const nWatermarks = textWatermarks.map(w => watermarkToNormalized(w, workCanvas.width, workCanvas.height));
    const arr = Array.from(files);
    showStatus("批量处理中 0 / " + arr.length);
    let done = 0, ok = 0, fail = 0;
    const processNext = (idx) => {
      if (idx >= arr.length) {
        hideStatus();
        setTimeout(() => alert("批量完成：成功 " + ok + "，失败 " + fail), 100);
        return;
      }
      const f = arr[idx];
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        try {
          const W = img.naturalWidth, H = img.naturalHeight;
          const cv = document.createElement("canvas");
          cv.width = W; cv.height = H;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0);
          nWatermarks.forEach(nw => {
            const wm = normalizedToWatermark(nw, W, H);
            renderTextWatermark(ctx, wm);
          });
          cv.toBlob((blob) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            const baseName = (f.name || "image").replace(/\.[^.]+$/, "");
            a.download = "加水印_" + baseName + "_" + Date.now() + ".png";
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1500);
            URL.revokeObjectURL(url);
            ok++; done++;
            showStatus("批量处理中 " + done + " / " + arr.length);
            setTimeout(() => processNext(idx + 1), 300);
          }, "image/png");
        } catch (err) {
          console.error(err); fail++; done++;
          URL.revokeObjectURL(url);
          setTimeout(() => processNext(idx + 1), 100);
        }
      };
      img.onerror = () => { fail++; done++; URL.revokeObjectURL(url); setTimeout(() => processNext(idx + 1), 100); };
      img.src = url;
    };
    processNext(0);
  };

  // ---------- Edit mode wiring ----------
  function setEditTool(t) {
    editTool = t;
    $("editBrushBtn").classList.toggle("active", t === "brush");
    $("editCropBtn").classList.toggle("active", t === "crop");
    $("editBrushSizeRow").style.display = t === "brush" ? "" : "none";
    $("editColorPalette").style.display = t === "brush" ? "" : "none";
    $("editCropActions").style.display = t === "crop" ? "flex" : "none";
    if (t !== "crop") { cropRect = null; cropDragging = false; }
    render();
  }
  $("editBrushBtn").onclick = () => setEditTool("brush");
  $("editCropBtn").onclick = () => setEditTool("crop");
  $("rotateLeftBtn").onclick = () => rotateImage(-90);
  $("rotateRightBtn").onclick = () => rotateImage(90);
  $("confirmCropBtn").onclick = confirmCrop;
  $("cancelCropBtn").onclick = cancelCrop;
  $("editUndoBtn").onclick = () => $("undoBtn").click();
  $("editSizeRange").oninput = (e) => {
    editBrushSize = parseInt(e.target.value, 10);
    $("editSizeVal").textContent = editBrushSize + "px";
  };

  // ---------- Load storage ----------
  loadFromStorage();

  // ---------- Help sheet ----------
  const sheetMask=$("sheetMask");
  $("helpBtn").onclick=()=>sheetMask.classList.add("show");
  $("sheetClose").onclick=()=>sheetMask.classList.remove("show");
  sheetMask.addEventListener("click",(e)=>{ if (e.target===sheetMask) sheetMask.classList.remove("show"); });

  // ---------- Prevent page scroll/zoom ----------
  document.addEventListener("gesturestart",(e)=>e.preventDefault());
  document.addEventListener("touchmove",(e)=>{ if (e.touches.length>1) e.preventDefault(); }, { passive:false });
  window.addEventListener("resize", () => { if (hasImage) { const z=zoom; fitView(); if (z>minZoom) {} } });

  // ---------- PWA: install prompt ----------
  let deferredPrompt = null;
  const installBtn = $("installBtn");
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "inline-block";
  });
  installBtn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  };
  window.addEventListener("appinstalled", () => { installBtn.style.display = "none"; });
})();

// ---------- PWA: register service worker ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      // 每次打开主动检查更新
      reg.update();
      // 发现新版本装好后，让它立即接管
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            // 新版本已就绪，下次导航即为新版
            console.log("发现新版本，已在后台更新");
          }
        });
      });
    }).catch((err) => console.warn("SW 注册失败:", err));

    // 新 SW 接管后自动刷新一次，确保看到最新页面
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
}
</script>





</body>
